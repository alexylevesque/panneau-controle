plugins { id 'com.android.application' }

android {
    namespace 'ca.panneau.pont'
    compileSdk 34

    defaultConfig {
        applicationId 'ca.panneau.pont'
        minSdk 21
        targetSdk 23          // tablette Android 6 : pas de permissions compliquées
        versionCode 4
        versionName "1.3"
    }
    signingConfigs {
        pont { storeFile file('../pont.keystore'); storePassword 'panneau'; keyAlias 'pont'; keyPassword 'panneau' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.pont }
        debug { signingConfig signingConfigs.pont }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
}
